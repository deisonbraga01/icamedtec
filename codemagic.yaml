workflows:
  ios_pwabuilder_testflight:
    name: iOS PWABuilder TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 120

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    integrations:
      app_store_connect: Deison Braga

    environment:
      xcode: latest
      ios_signing:
        provisioning_profiles:
          - cm_profile_appicamedtec_appstore
        certificates:
          - cm_certificate_apple_distribution_v2
      vars:
        XCODE_WORKSPACE: "src/ICA Med Tec.xcworkspace"
        XCODE_SCHEME: "ICA Med Tec"
        BUNDLE_ID: "br.com.icamedtec.telemedicinahumana"

    scripts:
      - name: Install CocoaPods dependencies
        script: |
          cd src
          pod install --repo-update

      - name: Verify workspace and Pods
        script: |
          test -f "src/ICA Med Tec.xcworkspace/contents.xcworkspacedata"
          test -d "src/Pods"
          ls -la "src/ICA Med Tec.xcworkspace"

      - name: Set unique iOS build number
        script: |
          IOS_BUILD_NUMBER="$(date +%s)"
          echo "Using iOS build number: ${IOS_BUILD_NUMBER}"
          cd src
          agvtool -project "ICA Med Tec.xcodeproj" new-version -all "${IOS_BUILD_NUMBER}"

      - name: Fetch signing files from App Store Connect
        script: xcode-project use-profiles

      - name: Build iOS IPA
        script: |
          set -e
          WORKSPACE_PATH="${CM_BUILD_DIR}/src/ICA Med Tec.xcworkspace"
          SCHEME_NAME="ICA Med Tec"
          echo "CM_BUILD_DIR=${CM_BUILD_DIR}"
          echo "WORKSPACE_PATH=${WORKSPACE_PATH}"
          ls -la "${WORKSPACE_PATH}" || ls -la "src/"
          xcodebuild -workspace "${WORKSPACE_PATH}" -scheme "${SCHEME_NAME}" -showBuildSettings -configuration Release | head -30
          xcode-project build-ipa \
            --workspace "${WORKSPACE_PATH}" \
            --scheme "${SCHEME_NAME}" \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
